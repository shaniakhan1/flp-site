<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FLP responsive layout check</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#e8ece9;color:#252d2a;font:14px/1.5 system-ui,sans-serif}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px}h1{font-size:18px;margin:0}select,button{font:inherit;padding:9px;border:1px solid #8b9a90;background:#fff;border-radius:5px}label{display:flex;gap:8px;align-items:center}#stage{overflow:auto;padding:2px 2px 15px}iframe{display:block;width:390px;height:844px;border:0;background:white;box-shadow:0 0 0 1px #aab5ae;margin:0 auto}pre{white-space:pre-wrap;max-width:900px;margin:12px auto;font:12px/1.5 monospace}p{margin:6px 0 12px}
</style></head><body><header><h1>FLP responsive layout check</h1><label>Page <select id="page"><option value="../">Homepage</option><option value="../guides/lead-follow-up-for-service-businesses/">Follow-up guide</option><option value="../guides/booking-page-checklist/">Booking guide</option></select></label><label>Width <select id="width"><option>320</option><option>360</option><option selected>390</option><option>430</option><option>768</option><option>1024</option></select></label><label>Section <select id="section"><option value="">Opening</option><option value="demo">Example</option><option value="inside">Scope</option><option value="pricing">Pricing</option><option value="founder">Founder</option><option value="private-advisory">Advisory</option><option value="start">Fit checker</option></select></label><button id="inspect">Inspect layout</button><a href="../">Open website</a></header><p>Renders the live page inside a browser viewport of the selected width. This checks responsive layout, not a physical phone or Safari.</p><div id="stage"><iframe title="FLP responsive preview" src="../?qa=responsive"></iframe></div><pre id="results" aria-live="polite"></pre><script>
const frame=document.querySelector('iframe');
document.getElementById('width').addEventListener('change',e=>{frame.style.width=e.target.value+'px';document.getElementById('results').textContent='';});
const page=document.getElementById('page'),section=document.getElementById('section');
function navigate(){frame.src=page.value+'?qa=responsive'+(page.value==='../'&&section.value?'#'+section.value:'');document.getElementById('results').textContent='';}
page.addEventListener('change',()=>{section.value='';section.disabled=page.value!=='../';navigate();});
section.addEventListener('change',navigate);
document.getElementById('inspect').addEventListener('click',()=>{
 const d=frame.contentDocument,w=frame.contentWindow,viewport=d.documentElement.clientWidth;
 const overflows=Array.from(d.body.querySelectorAll('*')).filter(el=>{const r=el.getBoundingClientRect(),s=w.getComputedStyle(el);return !el.closest('details:not([open]) nav')&&s.display!=='none'&&r.width>0&&(r.right>viewport+1||r.left< -1);}).map(el=>el.tagName.toLowerCase()+(el.id?'#'+el.id:el.className?'.'+String(el.className).trim().replace(/\s+/g,'.'):''));
 const cta=d.querySelector('.hero-actions .button')?.getBoundingClientRect();
 document.getElementById('results').textContent=JSON.stringify({frameWidth:w.innerWidth,contentWidth:viewport,documentWidth:d.documentElement.scrollWidth,bodyWidth:d.body.scrollWidth,horizontalOverflow:overflows,openingCtaBottom:cta?Math.round(cta.bottom+w.scrollY):null,viewportHeight:w.innerHeight,heading:d.querySelector('h1').textContent},null,2);
});
</script></body></html>
